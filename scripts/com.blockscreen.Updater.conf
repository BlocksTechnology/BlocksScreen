<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://dbus.freedesktop.org/doc/dbus-daemon-1.8.dtd">
<busconfig>
  <!-- Default: deny all access to the updater interface -->
  <policy context="default">
    <deny send_destination="com.blockscreen.Updater"/>
  </policy>
  <!-- Allow the blocks user (the UI runs as this user) -->
  <policy user="blocks">
    <allow own="com.blockscreen.Updater"/>
    <allow send_destination="com.blockscreen.Updater"/>
    <allow receive_sender="com.blockscreen.Updater"/>
  </policy>
  <!-- Allow root for admin operations -->
  <policy user="root">
    <allow send_destination="com.blockscreen.Updater"/>
    <allow receive_sender="com.blockscreen.Updater"/>
  </policy>
</busconfig>
