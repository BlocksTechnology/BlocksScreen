[project]
name = "BlocksScreen"
dynamic = ['version', 'dependencies', 'optional-dependencies']
description = "GUI for BLOCKS Printers running Klipper"
authors = [
  { name = "Hugo do Carmo Costa", email = "hugo.santos.costa@gmail.com" },
]
maintainers = [
  { name = "Guilherme Costa", email = "guilherme.costa@blockstec.com" },
  { name = "Roberto Martins ", email = "roberto.martins@blockstec.com" },
]
requires-python = "==3.11.2"
readme = "README.md"
license = { text = "GNU Affero General Public License v3.0 or later" }
keywords = ["GUI", "klipper", "BlocksScreen", "BLOCKS"]

# The requirements files are the only place versions live; a second list here drifted to pins the Pi cannot install.
[tool.setuptools.dynamic]
dependencies = { file = ["scripts/requirements.txt"] }
optional-dependencies.dev = { file = ["scripts/requirements-dev.txt"] }

[project.urls]
Homepage = "https://blockstec.com"
Issues = "https://github.com/BlocksTechnology/BlocksScreen/issues"

[tool.ruff]
target-version = "py311"
line-length = 88
indent-width = 4
exclude = [
  ".bzr",
  ".direnv",
  ".eggs",
  ".git",
  ".git-rewrite",
  ".hg",
  ".ipynb_checkpoints",
  ".mypy_cache",
  ".nox",
  ".pants.d",
  ".pyenv",
  ".pytest_cache",
  ".pytype",
  ".ruff_cache",
  ".svn",
  ".tox",
  ".venv",
  ".vscode",
  "__pypackages__",
  "_build",
  "buck-out",
  "build",
  "dist",
  "node_modules",
  "site-packages",
  "venv",
  "BlocksScreen/lib/ui",
  "extras",
  "tests",
]

[tool.ruff.lint]
ignore = ["F403"]

[tool.ruff.format]
indent-style = "space"
line-ending = 'auto'
docstring-code-format = true
docstring-code-line-length = 94

[tool.pylint]
fail-under = 7
jobs = 16
ignore = ["tests", "scripts", "ui", "extras"]
ignore-paths = ["BlocksScreen/lib/ui"]
py-version = "3.11"
max-line-length = 88

[tool.pytest.ini_options]
addopts = "--cov=BlocksScreen --cov-report=html"

[tool.bandit]
exclude_dirs = ["tests", "BlocksScreen/lib/ui/resources/", ".venv", "mutants", "htmlcov"]
