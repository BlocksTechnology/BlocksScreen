name: Bug report
description: Something on the printer screen is broken or behaves wrongly
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What went wrong, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Tap ...
        3. See ...
    validations:
      required: true
  - type: dropdown
    id: branch
    attributes:
      label: Branch
      description: The branch the printer tracks.
      options:
        - Release-2.0
        - main
        - stage
        - dev
        - Other
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit
      description: "`git -C ~/BlocksScreen rev-parse --short HEAD` on the printer, if known."
  - type: input
    id: hardware
    attributes:
      label: Printer and hardware
      placeholder: e.g. RF50, Raspberry Pi 5, AMU attached
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant lines from logs/BlocksScreen.log and klippy.log.
      render: shell
  - type: textarea
    id: context
    attributes:
      label: Screenshots and context
