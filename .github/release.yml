# Categories for GitHub's "Generate release notes"; first matching label wins, so "*" stays last.
changelog:
  categories:
    - title: Breaking changes
      labels: ["breaking"]
    - title: Features
      labels: ["enhancement"]
    - title: Bug fixes
      labels: ["bug"]
    - title: Performance
      labels: ["performance"]
    - title: Refactoring
      labels: ["refactor"]
    - title: Documentation
      labels: ["documentation"]
    - title: Dependencies
      labels: ["dependencies"]
    - title: Other changes
      labels: ["*"]
