poll_interval_minutes: 1440

# Override per unit (merged by name) in ~/printer_data/config/blockscreen_updater.yaml.

components:
  - name: klipper
    type: git
    path: ~/klipper
    url: https://github.com/Klipper3d/klipper
    service: klipper.service
    reset_mode: hard
    branch: master
    order: 2
    restart_ui: true

  - name: moonraker
    type: git
    path: ~/moonraker
    url: https://github.com/Arksine/moonraker
    service: moonraker.service
    reset_mode: hard
    order: 3

  - name: RF50-Klipper
    type: git
    path: ~/RF50-Klipper
    url: https://github.com/BlocksTechnology/RF50-Klipper
    branch: feat/amu-configs
    service: klipper.service
    reset_mode: hard
    order: 10
    restart_ui: true

  - name: mainsail-config
    type: git
    path: ~/mainsail-config
    url: https://github.com/mainsail-crew/mainsail-config
    branch: master
    service: klipper.service
    reset_mode: hard
    order: 13

  # Device discovery daemon (BlocksTechnology/DeviceDiscovery). Cloned on
  # machines that lack it; the hook then defers first-time setup (apt deps,
  # full build, systemd unit - root) to scripts/install-updater.sh.
  - name: DeviceDiscovery
    type: git
    path: ~/DeviceDiscovery
    url: https://github.com/BlocksTechnology/DeviceDiscovery.git
    install_if_missing: true
    branch: main
    service: device-discoveryd.service
    reset_mode: hard
    order: 15

  - name: katapult
    type: git
    path: ~/katapult
    url: https://github.com/arksine/katapult
    branch: master
    reset_mode: hard
    order: 25
    restart_ui: false
    install_if_missing: true

  - name: crowsnest
    type: git
    path: ~/crowsnest
    url: https://github.com/mainsail-crew/crowsnest
    service: crowsnest.service
    reset_mode: hard
    order: 20

  - name: Spoolman
    type: git
    path: ~/Spoolman
    url: https://github.com/Donkie/Spoolman
    branch: master
    service: Spoolman.service
    reset_mode: hard
    order: 21
    install_if_missing: true
    health_url: http://127.0.0.1:7912/api/v1/health

  - name: BlocksScreen
    type: git
    path: ~/BlocksScreen
    branch: dev
    url: https://github.com/BlocksTechnology/BlocksScreen
    service: BlocksScreen.service
    reset_mode: hard
    order: 99
