poll_interval_minutes: 1440

# Optional per-component keys for auto-provisioning a missing component:
#   url: https://...        # https-only clone URL (required to provision)
#   install_if_missing: true  # clone + deps + hook when the path is absent
# Both can be set here or per-unit in ~/printer_data/config/blockscreen_updater.yaml
# (merged by name). Without a valid url, install_if_missing is ignored.
#
# install_if_missing only fully provisions a component whose install the core
# flow + a hooks/<name>.sh can complete unattended. It suits self-contained apps
# (Spoolman: venv + pip + own service) and config-only repos. It does NOT suit
# components needing interactive/hardware-specific setup or a frontend build.

components:
  - name: klipper
    type: git
    path: ~/klipper
    url: https://github.com/Klipper3d/klipper
    service: klipper.service
    reset_mode: hard
    order: 2
    restart_ui: true

  - name: moonraker
    type: git
    path: ~/moonraker
    url: https://github.com/Arksine/moonraker
    service: moonraker.service
    reset_mode: hard
    order: 3

  # Private BlocksTechnology fork: https auto-clone needs credentials, so
  # install_if_missing is intentionally omitted (the field already has it).
  - name: RF50-Klipper
    type: git
    path: ~/RF50-Klipper
    url: https://github.com/BlocksTechnology/RF50-Klipper
    branch: main
    service: klipper.service
    reset_mode: hard
    order: 10
    restart_ui: true

  - name: mainsail-config
    type: git
    path: ~/mainsail-config
    url: https://github.com/mainsail-crew/mainsail-config
    branch: master
    service: klipper.service
    reset_mode: hard
    order: 13

  - name: crowsnest
    type: git
    path: ~/crowsnest
    url: https://github.com/mainsail-crew/crowsnest
    service: crowsnest.service
    reset_mode: hard
    order: 20

  # Self-contained: provisioned by hooks/Spoolman.sh (uv sync from source +
  # SQLite .env + enable Spoolman.service). BlocksScreen uses Spoolman's REST API
  # via moonraker, so the backend-only install is sufficient (no web-client build).
  - name: Spoolman
    type: git
    path: ~/Spoolman
    url: https://github.com/Donkie/Spoolman
    branch: master
    service: Spoolman.service
    reset_mode: hard
    order: 21
    install_if_missing: true

  # Private BlocksTechnology repo: https auto-clone needs credentials, so
  # install_if_missing is intentionally omitted.
  - name: BlocksScreen
    type: git
    path: ~/BlocksScreen
    url: https://github.com/BlocksTechnology/BlocksScreen
    service: BlocksScreen.service
    reset_mode: hard
    order: 99
